services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"  # Puerto externo:puerto interno
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:CAMBIAR_EN_LOCAL@147.93.178.204:5433/gestionInventario
      - SECRET_KEY=CAMBIAR_EN_LOCAL  # Ajuste en producción
      - APP_PORT=8001
    volumes:
      - .:/app
    networks:
      - app-network
    deploy:
      restart_policy:
        condition: on-failure

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:  # Este volumen ya no es necesario, pero lo dejamos por consistencia